<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Candra's Room ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Loading veil -->
  <div id="loading-veil">
    <div class="loading-heart">♡</div>
  </div>

  <main id="room-stage" aria-label="Kamar interaktif Candra">

    <!-- ambient light overlay -->
    <div id="sun-glow" aria-hidden="true"></div>
    <div id="dust-layer" aria-hidden="true"></div>

    <!-- static / decorative layers -->
    <img class="layer" id="layer-bg" src="" alt="" draggable="false" />
    <img class="layer" id="layer-notes" src="" alt="" draggable="false" aria-hidden="true" />

    <!-- human is special: idle vs facing -->
    <img class="layer human-layer" id="layer-human-reading" src="" alt="Candra sedang membaca" draggable="false" />
    <img class="layer human-layer" id="layer-human-facing" src="" alt="Candra menoleh ke kamu" draggable="false" />

    <!-- interactive object layers get injected by script.js -->
    <div id="hotspot-layers"></div>

    <!-- invisible canvas used only for pointer/alpha hit-testing, never shown -->
    <canvas id="hit-canvas" style="display:none;"></canvas>

    <!-- speech bubble for the human -->
    <div id="speech-bubble" class="speech-bubble hidden" role="dialog" aria-label="Perkenalan Candra">
      <div class="speech-tail"></div>
      <p class="speech-greeting">Hi, I'm Candra ♡</p>
      <ul class="speech-list" id="speech-list"></ul>
    </div>

    <!-- first-visit hint -->
    <div id="onboard-hint" class="onboard-hint">
      <span>tap benda di kamar untuk explore</span>
      <span class="onboard-sparkle">✨</span>
    </div>

  </main>

  <!-- content modal -->
  <div id="modal-scrim" class="modal-scrim hidden">
    <section id="modal-card" class="modal-card" role="dialog" aria-modal="true">
      <button id="modal-close" class="modal-close" aria-label="Tutup">✕</button>
      <header class="modal-header">
        <p class="modal-eyebrow" id="modal-eyebrow"></p>
        <h2 class="modal-title" id="modal-title"></h2>
      </header>
      <div class="modal-body" id="modal-body"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
